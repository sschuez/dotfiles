[env]
# Use Alacritty's own terminfo so the tmux `alacritty:*` overrides
# (RGB truecolor + italics/undercurl) apply. The `alacritty` terminfo
# entry ships with Alacritty; verify with `infocmp alacritty`.
TERM = "alacritty"

[terminal.shell]
program = "/opt/homebrew/bin/bash"
args = ["--login"]

[window]
padding.x = 10
padding.y = 10
decorations = "Buttonless"
opacity = 0.98

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"


# Snow theme for Ghostty
background = ffffff
foreground = 0a0a0a
cursor-color = 0a0a0a
selection-background = 0a0a0a
selection-foreground = ffffff

# Most palette colors equal the foreground, so text on an ANSI-colored
# background is invisible. Flip it instead.
minimum-contrast = 1.1

palette = 0=#c0c0c0
palette = 1=#0a0a0a
palette = 2=#0a0a0a
palette = 3=#0a0a0a
# Gray, not black: TUIs use blue as a background (lazygit's selected line)
palette = 4=#808080
palette = 5=#0a0a0a
palette = 6=#0a0a0a
palette = 7=#0a0a0a
palette = 8=#d0d0d0
palette = 9=#0a0a0a
palette = 10=#0a0a0a
palette = 11=#0a0a0a
palette = 12=#0a0a0a
palette = 13=#0a0a0a
palette = 14=#0a0a0a
palette = 15=#0a0a0a
